[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
# The product/distribution is MAgent. Package indexes normalize this name;
# Python imports and the console script remain lowercase technical identifiers.
name = "MAgent"
version = "1.1.0"
description = "Mr. Agent, Powerful - a zero-dependency Python agent framework built for Cortex LLMHoster"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "codero-sus" }]
keywords = [
  "agent",
  "agents",
  "llm",
  "cortex",
  "cortex-llmhoster",
  "local-llm",
  "react",
  "tools",
  "desktop-automation",
  "computer-use",
  "rag",
  "multi-agent",
  "cli",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

# MAgent has ZERO mandatory third-party runtime dependencies.
# Everything below is optional acceleration / developer tooling.
dependencies = []

[project.optional-dependencies]
# Faster HTTP transport when installed; MAgent falls back to the stdlib client.
fast = ["httpx>=0.27,<1"]
# Cross-platform pointer/keyboard capture. Native fallbacks keep this optional.
desktop = ["PyAutoGUI>=0.9.54,<1", "Pillow>=10,<13"]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://the-codero.web.app/"
Repository = "https://github.com/codero-sus/MAgent"
Issues = "https://github.com/codero-sus/MAgent/issues"
Author = "https://github.com/codero-sus"
License = "https://polyformproject.org/licenses/noncommercial/1.0.0/"
"Cortex LLMHoster" = "https://github.com/codero-sus/Cortex_LLMHoster"

[project.scripts]
magent = "magent.cli.main:main"
mr-agent = "magent.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magent"]

[tool.hatch.build.targets.wheel.force-include]
"src/magent/server/static/index.html" = "magent/server/static/index.html"
"docs" = "magent/_docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
# The project intentionally favours explicit control flow and stdlib os.path in
# several low-level modules. Keep Ruff strict on syntax, imports, undefined names,
# and formatting while documenting the style rules this existing codebase does
# not adopt.
ignore = [
  "E501",
  "ARG001", "ARG002", "ARG003", "ARG005",
  "B007", "B017", "B905",
  "C401", "C416",
  "PTH101", "PTH105", "PTH108", "PTH109", "PTH111", "PTH123", "PTH202",
  "RET503", "RET504",
  "RUF001", "RUF005", "RUF007", "RUF012", "RUF034", "RUF046", "RUF059",
  "SIM101", "SIM102", "SIM105", "SIM108", "SIM110", "SIM401",
  "UP028",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "B011"]
"examples/*" = ["ARG001"]

[tool.mypy]
python_version = "3.11"
files = ["src/magent"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
