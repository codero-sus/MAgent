# MAgent preset: cautious local operations. Network stays off until explicitly enabled.

[agent]
persona = "devops"
loop_mode = "plan"
max_iterations = 12
max_tool_calls_per_step = 4
planning = true
replan_on_failure = true
stop_on_error = true

[generation]
temperature = 0.0

[tools]
approval_mode = "ask"
allow_network = false

[guardrails]
enabled = true
budget_max_steps = 12
budget_max_tool_calls = 30
