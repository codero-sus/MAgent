# MAgent preset: defect-first code and document review.

[agent]
persona = "reviewer"
loop_mode = "reflect"
max_iterations = 10
max_tool_calls_per_step = 5
reflection = true
reflection_every = 2
planning = false

[generation]
temperature = 0.0

[tools]
approval_mode = "never"
allow_network = false

[guardrails]
enabled = true
budget_max_steps = 10
