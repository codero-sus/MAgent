# MAgent preset: evidence-bound research over local or explicitly allowed sources.

[agent]
persona = "researcher"
loop_mode = "plan"
max_iterations = 16
max_tool_calls_per_step = 6
planning = true
replan_on_failure = true
reflection = true
reflection_every = 4

[generation]
temperature = 0.2

[memory]
retrieval_mode = "hybrid"
retrieval_top_k = 8

[tools]
approval_mode = "dangerous"
allow_network = false

[guardrails]
enabled = true
budget_max_steps = 16
budget_max_tool_calls = 60
