# MAgent preset: repository coding with bounded tool use.

[agent]
persona = "coder"
loop_mode = "react"
max_iterations = 12
max_tool_calls_per_step = 6
parallel_tools = true
reflection = false
planning = false
stop_on_error = false

[generation]
temperature = 0.1

[tools]
approval_mode = "dangerous"
allow_network = false

[guardrails]
enabled = true
budget_max_steps = 12
budget_max_tool_calls = 40
